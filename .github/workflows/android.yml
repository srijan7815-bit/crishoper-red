name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'system_prompt.md'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.event.inputs.variant || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: false

      # Signing is optional: if the repository has the secrets, the release APK
      # is signed here. Without them the workflow still produces a debug APK,
      # so forks and pull requests build without access to the real key.
      - name: Decode signing key
        id: signing
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/red-release.jks
          cat > android/keystore.properties <<PROPS
          storeFile=red-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS
          echo "configured=yes" >> "$GITHUB_OUTPUT"

      - name: Verify system prompt is present
        run: |
          test -s system_prompt.md || { echo "system_prompt.md missing"; exit 1; }
          echo "prompt bytes: $(wc -c < system_prompt.md)"

      - name: Lint
        run: gradle --no-daemon -p android :app:lintDebug || true

      - name: Unit tests
        run: gradle --no-daemon -p android :app:testDebugUnitTest

      - name: Build
        id: build
        run: |
          VARIANT="${{ github.event.inputs.variant || 'debug' }}"
          if [ "$VARIANT" = "release" ]; then
            gradle --no-daemon -p android :app:assembleRelease
            OUT=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          else
            gradle --no-daemon -p android :app:assembleDebug
            OUT=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          fi
          test -n "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "### Built \`$OUT\` ($(stat -c%s "$OUT") bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK
        run: |
          APK="${{ steps.build.outputs.apk }}"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | head -5
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -4

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crishoper-red-${{ github.event.inputs.variant || 'debug' }}
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload mapping (release)
        if: ${{ github.event.inputs.variant == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
