name: Bug report
description: Something in the app behaves incorrectly
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste API keys, OAuth tokens, or private conversation content.**
        Redact anything sensitive before submitting. For security issues, close
        this form and use the private channel in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings › About › Version (or the APK filename)
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 7, Android 15 (API 35)"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Model provider in use
      options:
        - OpenRouter
        - OpenAI (direct)
        - Google Gemini (direct)
        - Demo mode (no keys)
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from app launch.
      placeholder: |
        1. Open an operation
        2. Send "…"
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the failing step card, not the whole conversation.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logcat (optional)
      render: shell
      description: "`adb logcat -s RedEngine:V RedViewModel:V` while the bug happens."
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I removed every key, token and private snippet from this report.
          required: true
        - label: I searched existing issues for the same behaviour.
          required: true
