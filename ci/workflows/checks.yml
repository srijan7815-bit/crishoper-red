name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  prompt-guard:
    name: System prompt guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prompt exists and is bounded
        run: |
          test -s system_prompt.md
          BYTES=$(wc -c < system_prompt.md)
          echo "system_prompt.md = $BYTES bytes"
          test "$BYTES" -gt 1000 -a "$BYTES" -lt 40000 || {
            echo "::error::system_prompt.md must stay between 1 KB and 40 KB (context budget)"; exit 1; }
      - name: No secrets committed
        run: |
          if grep -rnE '(sk-or-v1-|tvly-|e2b_[A-Za-z0-9]{10,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})' \
              --include='*.kt' --include='*.md' --include='*.yml' --include='*.json' . ; then
            echo "::error::a credential-shaped string is committed"; exit 1
          fi
          echo "no credential patterns found"
      - name: No web payload (native only)
        run: |
          if find android/app/src/main -name '*.html' -o -name '*.js' | grep -q .; then
            echo "::error::this repository ships a native UI; web payloads are not allowed"; exit 1
          fi
          echo "no web payload in the app module"

  gradle-check:
    name: Gradle & Kotlin syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - run: gradle --no-daemon -p android :app:compileDebugKotlin
